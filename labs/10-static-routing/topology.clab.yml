name: static-routing

topology:
  nodes:
    host1:
      kind: linux
      image: nicolaka/netshoot:latest
    r1:
      kind: frr
      image: quay.io/frrouting/frr:latest
    r2:
      kind: frr
      image: quay.io/frrouting/frr:latest
    host2:
      kind: linux
      image: nicolaka/netshoot:latest

  links:
    - endpoints: ["host1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "host2:eth1"]
