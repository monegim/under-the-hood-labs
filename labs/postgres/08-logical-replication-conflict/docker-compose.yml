services:
  publisher:
    image: postgres:16
    container_name: pglab8-publisher
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    ports:
      - "5441:5432"
    volumes:
      - ./data/publisher:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  subscriber:
    image: postgres:16
    container_name: pglab8-subscriber
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5442:5432"
    volumes:
      - ./data/subscriber:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      publisher:
        condition: service_healthy
