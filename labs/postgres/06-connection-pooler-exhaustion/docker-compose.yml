services:
  primary:
    image: postgres:16
    container_name: pglab6-primary
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "5439:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pglab6-pgbouncer
    environment:
      DATABASE_URL: "postgres://postgres:postgres@primary:5432/appdb"
      POOL_MODE: ${POOL_MODE:-transaction}
      DEFAULT_POOL_SIZE: ${DEFAULT_POOL_SIZE:-5}
      MAX_CLIENT_CONN: 100
      ADMIN_USERS: postgres
      AUTH_TYPE: plain
    ports:
      - "6432:5432"
    depends_on:
      primary:
        condition: service_healthy
