name: ipsec-lab

topology:
  nodes:
    hostA:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    r1:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    r2:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    hostB:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN

  links:
    - endpoints: ["hostA:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "hostB:eth1"]
