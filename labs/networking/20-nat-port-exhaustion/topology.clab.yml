name: natexh

topology:
  nodes:
    host-int:
      kind: linux
      image: nicolaka/netshoot:latest
    router:
      kind: linux
      image: nicolaka/netshoot:latest
      privileged: true
    host-ext:
      kind: linux
      image: nicolaka/netshoot:latest

  links:
    - endpoints: ["host-int:eth1", "router:eth1"]
    - endpoints: ["router:eth2", "host-ext:eth1"]
