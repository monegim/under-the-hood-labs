name: arp-lab

topology:
  nodes:
    client:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    switch:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    server-a:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    server-b:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN

  links:
    - endpoints: ["client:eth1", "switch:eth1"]
    - endpoints: ["server-a:eth1", "switch:eth2"]
    - endpoints: ["server-b:eth1", "switch:eth3"]
