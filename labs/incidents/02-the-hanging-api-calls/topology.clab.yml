name: mtu-incident

topology:
  nodes:
    api:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    r1:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    r2:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN
    db:
      kind: linux
      image: debian:bookworm-slim
      cap-add:
        - NET_ADMIN

  links:
    - endpoints: ["api:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "db:eth1"]
